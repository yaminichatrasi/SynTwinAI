<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Experiment | SynTwin AI</title>

<link rel="stylesheet" href="/static/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

.experiment-page{
    min-height:100vh;
    padding:50px 20px;
}

.workspace{
    width:100%;
    max-width:1050px;
    margin:auto;
    padding:40px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.08);
    border-radius:25px;
    backdrop-filter:blur(18px);
    box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.back-btn{
    display:inline-block;
    color:#00e5ff;
    font-weight:600;
    margin-bottom:25px;
}

.workspace-header{
    text-align:center;
    margin-bottom:35px;
}

.workspace-header h1{
    font-size:36px;
    color:#00e5ff;
    margin-bottom:10px;
}

.workspace-header p{
    color:#b8c5d6;
    font-size:15px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
}

.input-box{
    display:flex;
    flex-direction:column;
}

.input-box.full{
    grid-column:1 / 3;
}

.input-box label{
    margin-bottom:9px;
    color:#e8f0fa;
    font-size:14px;
    font-weight:600;
}

.input-box input,
.input-box textarea{
    width:100%;
    padding:14px 16px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;
    outline:none;
    background:#101b32;
    color:white;
    font-family:'Poppins',sans-serif;
    font-size:14px;
    transition:.3s;
}

.input-box input{
    height:50px;
}

.input-box textarea{
    height:120px;
    resize:vertical;
}

.input-box input::placeholder,
.input-box textarea::placeholder{
    color:#718096;
}

.input-box input:focus,
.input-box textarea:focus{
    border-color:#00e5ff;
    box-shadow:0 0 0 2px rgba(0,229,255,.12);
}

.generate-btn{
    width:100%;
    margin-top:30px;
    padding:16px;
    border-radius:35px;
    background:linear-gradient(90deg,#00d9ff,#6c63ff);
    color:white;
    font-family:'Poppins',sans-serif;
    font-size:17px;
    font-weight:600;
    border:none;
    cursor:pointer;
    transition:.3s;
}

.generate-btn:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 30px rgba(0,229,255,.35);
}

@media(max-width:750px){

    .workspace{
        padding:25px 20px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .input-box.full{
        grid-column:1;
    }

    .workspace-header h1{
        font-size:28px;
    }
}

</style>
</head>

<body>

<div class="experiment-page">

<div class="workspace">

<a href="/" class="back-btn">← Back Home</a>

<div class="workspace-header">

<h1>Create New Experiment</h1>

<p>
Create an experiment and generate realistic AI Digital Twins.
</p>

</div>

<form action="/dashboard" method="post">

<div class="form-grid">

<!-- Experiment Name -->

<div class="input-box">

<label>Experiment Name</label>

<input
type="text"
name="experiment_name"
placeholder="Example: Farmer Voice Note Usability Study"
required>

</div>


<!-- Product -->

<div class="input-box">

<label>Product / Service</label>

<input
type="text"
name="product_name"
placeholder="Example: FieldNote"
required>

</div>


<!-- Description -->

<div class="input-box full">

<label>Description</label>

<textarea
name="description"
placeholder="Describe your product, service or research context..."
required></textarea>

</div>


<!-- Audience -->

<div class="input-box">

<label>Target Audience</label>

<input
type="text"
name="audience"
placeholder="Example: Farmers aged 25–55"
required>

</div>


<!-- Objective -->

<div class="input-box">

<label>Research Objective</label>

<input
type="text"
name="objective"
placeholder="Example: Understand how farmers record field notes"
required>

</div>


<!-- Persona Count -->

<div class="input-box">

<label>Number of Personas</label>

<input
type="number"
name="personas"
placeholder="Example: 5"
min="1"
max="150"
required>

</div>


<!-- Domain -->

<div class="input-box">

<label>Research Domain</label>

<input
type="text"
name="simulation"
placeholder="Example: Agriculture"
required>

</div>

</div>


<button
type="submit"
class="generate-btn">

🚀 Generate AI Digital Twins

</button>

</form>

</div>

</div>

</body>
</html>
